[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corei-os-mini"
version = "0.1.0"
description = "COREI-OS-MINI trading workstation backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "cryptography>=46,<47",
  "duckdb>=1.4,<3",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
