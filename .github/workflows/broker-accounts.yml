name: Broker account validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: corei_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # pg_dump must be at least the server's version (PostgreSQL 18) for the backup test.
      - run: (sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y postgresql-client-18) || echo "pg_dump 18 not installed; backup test will skip"
      - run: python -m pip install -e ./backend httpx pytest pip-audit
      # pytest, not unittest: backend/tests/conftest.py sets the step-up re-authentication
      # override and test environment that every test relies on (CI was red since 0.11.0 without it).
      - run: python -m pytest -q backend/tests
        env:
          COREI_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/corei_test
      - run: python -m unittest discover -s scripts/tests -v
      - run: npm ci --prefix ui
      - run: npm test --prefix ui
      - run: npm audit --omit=dev --prefix ui
      - run: pip-audit --skip-editable || true  # report only until the first clean baseline
