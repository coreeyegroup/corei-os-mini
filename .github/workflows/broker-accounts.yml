name: Broker account validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: corei_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e ./backend httpx
      - run: python -m unittest discover -s backend/tests -v
        env:
          COREI_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/corei_test
      - run: python -m unittest discover -s scripts/tests -v
      - run: npm ci --prefix ui
      - run: npm test --prefix ui
